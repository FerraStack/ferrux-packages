# SPDX-License-Identifier: Apache-2.0
# One time-boxed build segment of the Ferrux package set (see
# ferrux-packages.yml). Each segment restores the published debs, builds
# what is missing until its deadline, and publishes the result, so chained
# segments together can run longer than the 6 h job limit.
name: Ferrux build segment

on:
  workflow_call:
    inputs:
      segment:
        type: string
        required: true
    secrets:
      FERRUX_APT_SIGNING_KEY:
        required: true
      FERRUX_APT_SIGNING_KEY_ID:
        required: true

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.arch }} (segment ${{ inputs.segment }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write # publish the repo-<arch> release
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    env:
      GH_TOKEN: ${{ github.token }}
      FERRUX_APT_SIGNING_KEY_ID: ${{ secrets.FERRUX_APT_SIGNING_KEY_ID }}
    steps:
      - name: Record deadline
        # Builds stop starting new packages 5 h 15 min into the job, leaving
        # time to publish before the 6 h limit.
        run: echo "FERRUX_DEADLINE=$(( $(date +%s) + 315 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: Host tools
        run: |
          command -v apt-ftparchive > /dev/null || { sudo apt-get update -q && sudo apt-get install -yq apt-utils; }
      - name: Import signing key
        env:
          KEY: ${{ secrets.FERRUX_APT_SIGNING_KEY }}
        run: |
          printf '%s\n' "$KEY" | gpg --batch --quiet --import
          gpg --batch --list-secret-keys --keyid-format long | grep -c '^sec' | xargs echo "secret keys:"
      - name: Restore published packages
        run: ferrux/fetch-repo.sh ${{ matrix.arch }}
      - name: Build
        id: build
        run: |
          set +e
          ferrux/build.sh ${{ matrix.arch }} "$FERRUX_DEADLINE"
          rc=$?
          echo "status=$(cat ferrux/status 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
          # 2 = stopped at the deadline: not an error, the next segment continues.
          if [ "$rc" = 2 ]; then exit 0; fi
          exit "$rc"
      - name: Publish repository
        if: always() && steps.build.conclusion != 'skipped'
        run: ferrux/publish-repo.sh ${{ matrix.arch }}
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.arch }} (segment ${{ inputs.segment }})"
            echo "status: \`${{ steps.build.outputs.status }}\`"
            echo
            echo "debs in output/: $(ls output/*.deb 2>/dev/null | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
